# build แล้ว deploy ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# ตั้งค่าครั้งเดียว: Settings → Pages → Source = "GitHub Actions"
# (ถ้ามี) Settings → Secrets and variables → Actions → Variables → API_BASE = https://<เว็บ>.netlify.app
#   GitHub Pages ไม่มีหลังบ้าน การโหลดเรนเจอร์/ฉากจาก lerico จะยืมฟังก์ชันของเว็บ Netlify นั้น
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: ./
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
